[profile.default]
src = "contracts/src"
out = "contracts/out"
libs = ["contracts/lib", "lib"]
test = "contracts/test"
script = "contracts/script"
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
fs_permissions = [{ access = "read", path = "./" }, { access = "read-write", path = "./contracts/deployments.json" }]
[fmt]
line_length = 120
tab_width = 4
