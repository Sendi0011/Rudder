[profile.default]
src = "contracts/src"
out = "contracts/out"
libs = ["contracts/lib", "lib"]
test = "contracts/test"
script = "contracts/script"
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
fs_permissions = [
    { access = "read", path = "./" },
    { access = "read-write", path = "./contracts/deployments.json" },
    { access = "read-write", path = "./contracts/seed.json" },
    { access = "read-write", path = "./evidence" }
]
[fmt]
line_length = 120
tab_width = 4

# Reduced-run profile for CI: same compiler settings, lighter fuzz/invariant search so the
# pipeline stays fast while still exercising every suite. Activate with FOUNDRY_PROFILE=ci.
[profile.ci]
fuzz = { runs = 128 }
invariant = { runs = 32, depth = 32 }
